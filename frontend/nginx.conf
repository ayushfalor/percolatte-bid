# Serves the built UI and forwards API calls to the api container (same origin, no CORS issues).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;

  # Re-resolve the api container's address, so restarting the api never breaks the UI.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/           { proxy_pass $api; proxy_read_timeout 300s; proxy_set_header Host $host; }
  location = /health       { proxy_pass $api; }
  location = /docs         { proxy_pass $api; }
  location = /openapi.json { proxy_pass $api; }

  location / { try_files $uri /index.html; }
}
