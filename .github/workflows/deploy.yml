# Deploy on a version tag, then prove the live app works.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Needs four repository secrets, set once in GitHub (Settings, Secrets and variables, Actions):
#   DEPLOY_HOST     the VM, for example 203.0.113.10 or bid.example.com
#   DEPLOY_USER     the SSH user that owns /opt/bid-workbench and can run docker
#   DEPLOY_SSH_KEY  that user's private key (the public half in the VM's ~/.ssh/authorized_keys)
#   DEPLOY_URL      where the app answers, for example https://bid.example.com
# The VM holds the repo at /opt/bid-workbench with its own .env (POSTGRES_PASSWORD, DOMAIN,
# optional ANTHROPIC_API_KEY). Nothing secret is in this file or in the repo.
name: deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the tag to the VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Write the SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Check out the tag on the VM and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/bid-workbench
            git fetch --tags origin
            git checkout --quiet "${GITHUB_REF_NAME:-main}" 2>/dev/null || git checkout --quiet "$(git describe --tags --abbrev=0)"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
          REMOTE
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Wait for the live app
        run: bash scripts/wait-for-health.sh
        env:
          API_URL: ${{ secrets.DEPLOY_URL }}
      - name: Smoke test the live app
        run: bash scripts/smoke.sh
        env:
          API_URL: ${{ secrets.DEPLOY_URL }}
          WEB_URL: ${{ secrets.DEPLOY_URL }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Phase 6 check against the deployed URL
        run: pip install -q httpx pytest && python -m pytest -q evals/test_phase6_deploy.py -k deployed_app
        working-directory: backend
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
