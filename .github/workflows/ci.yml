# Always on: every push and pull request runs the evals twice, fast (no Docker)
# and as a reviewer would (Docker, no .env, no API key).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast evals (no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned dependencies
        run: pip install -r backend/requirements.lock
      - name: Evals (unit, golden files, unseen workbook, phase gates, docs check)
        working-directory: backend
        run: python -m pytest -q -m "not stack"

  stack:
    name: Full stack in Docker (like a reviewer)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (no .env, no API key)
        run: docker compose up --build -d
      - name: Wait for the API
        run: bash scripts/wait-for-health.sh
      - name: All evals inside the api container, against the live stack
        run: docker compose run --rm -e API_URL=http://api:8000 api pytest -q
      - name: Smoke test from outside
        run: bash scripts/smoke.sh
      - name: Logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Clean up
        if: always()
        run: docker compose down -v
